version: '3.8'

services:
  keenmind-engine:
    build: .
    container_name: keenmind_automation_engine
    restart: unless-stopped
    ports:
      - "9876:9876"
    env_file:
      - .env
    volumes:
      - ./api:/app/api
      - ./core:/app/core
      - ./config:/app/config
      - ./output:/app/output
      - ./cache:/app/cache
      - ./temp:/app/temp
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "9876", "--reload"]
    networks:
      - keenmind_net

networks:
  keenmind_net:
    driver: bridge
